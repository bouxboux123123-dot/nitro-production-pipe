name: Render Video 1 Patch Matrix (20 Runners x 112 Reels)

on:
  workflow_dispatch:

env:
  ACTIONS_RUNNER_DEBUG: 'true'
  ACTIONS_STEP_DEBUG: 'true'

jobs:
  render-patch-slice:
    name: Patch Runner ${{ matrix.runner_padded }} (${{ matrix.count }} reels)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_id: 1
            runner_padded: "01"
            count: 6
          - runner_id: 2
            runner_padded: "02"
            count: 6
          - runner_id: 3
            runner_padded: "03"
            count: 6
          - runner_id: 4
            runner_padded: "04"
            count: 6
          - runner_id: 5
            runner_padded: "05"
            count: 6
          - runner_id: 6
            runner_padded: "06"
            count: 6
          - runner_id: 7
            runner_padded: "07"
            count: 6
          - runner_id: 8
            runner_padded: "08"
            count: 6
          - runner_id: 9
            runner_padded: "09"
            count: 6
          - runner_id: 10
            runner_padded: "10"
            count: 6
          - runner_id: 11
            runner_padded: "11"
            count: 6
          - runner_id: 12
            runner_padded: "12"
            count: 6
          - runner_id: 13
            runner_padded: "13"
            count: 5
          - runner_id: 14
            runner_padded: "14"
            count: 5
          - runner_id: 15
            runner_padded: "15"
            count: 5
          - runner_id: 16
            runner_padded: "16"
            count: 5
          - runner_id: 17
            runner_padded: "17"
            count: 5
          - runner_id: 18
            runner_padded: "18"
            count: 5
          - runner_id: 19
            runner_padded: "19"
            count: 5
          - runner_id: 20
            runner_padded: "20"
            count: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'flick-output/remotion/package-lock.json'

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true

      - name: Verify FFmpeg
        run: |
          ffmpeg -version || /usr/bin/ffmpeg -version

      - name: Install Remotion Dependencies
        working-directory: flick-output/remotion
        run: |
          npm ci || npm install

      - name: Render Patch Slice (Runner ${{ matrix.runner_id }})
        run: |
          python scripts/batch_patch_render.py --runner-id ${{ matrix.runner_id }} --total-runners 20

      - name: Upload Patch Videos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: patch-runner-${{ matrix.runner_padded }}-reels
          path: flick-output/remotion/out/patch-runner-${{ matrix.runner_padded }}/*.mp4
          retention-days: 7
          if-no-files-found: error
