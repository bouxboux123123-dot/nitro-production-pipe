name: 20-Runner Parallel Voiceover Production (1000 Scripts)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/batch_voiceover_matrix.yml'
      - 'scripts/batch_voiceover_runner.py'

jobs:
  synthesize-batch:
    name: ${{ matrix.page }} Chunk ${{ matrix.chunk }} (50 Scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - page: page-02
            chunk: 1
          - page: page-03
            chunk: 1
          - page: page-05
            chunk: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Verify System Audio Tools
        run: |
          ffmpeg -version || (sudo apt-get update && sudo apt-get install -y ffmpeg)

      - name: Install Python Dependencies
        run: |
          pip install kokoro-onnx faster-whisper soundfile numpy scipy

      - name: Run 50-Script Batch Voiceover & Alignment
        run: |
          python scripts/batch_voiceover_runner.py --page ${{ matrix.page }} --chunk ${{ matrix.chunk }}

      - name: Upload Voiceover Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voiceovers-${{ matrix.page }}-chunk-${{ matrix.chunk }}
          path: flick-output/${{ matrix.page }}/
          retention-days: 7
