name: Remotion Cloud Render

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Remotion Composition ID to render'
        required: true
        default: 'PythonStackReel'
      concurrency:
        description: 'Rendering Concurrency (CPU cores)'
        required: false
        default: '20'
      output_filename:
        description: 'Output MP4 filename (without extension)'
        required: false
        default: 'python-stack-reel'
  push:
    paths:
      - 'flick-output/remotion/src/**'
      - 'flick-output/remotion/public/**'
      - '.github/workflows/remotion_render.yml'

jobs:
  render-remotion:
    name: Render Remotion Reel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'flick-output/remotion/package-lock.json'

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install Remotion Dependencies
        working-directory: flick-output/remotion
        run: |
          npm ci || npm install

      - name: Render Remotion Reel
        working-directory: flick-output/remotion
        run: |
          COMPOSITION="${{ github.event.inputs.composition || 'PythonStackReel' }}"
          CONCURRENCY="${{ github.event.inputs.concurrency || '20' }}"
          OUTPUT_NAME="${{ github.event.inputs.output_filename || 'final-reel' }}"

          mkdir -p out
          CORES=$(nproc)
          ACTUAL_CONCURRENCY=$(( CONCURRENCY > CORES ? CORES : CONCURRENCY ))
          echo "=== Starting Remotion Cloud Render: $COMPOSITION (requested: $CONCURRENCY, cores: $CORES, using: $ACTUAL_CONCURRENCY) ==="
          npx remotion render src/index.tsx "$COMPOSITION" "out/${OUTPUT_NAME}.mp4" --concurrency="$ACTUAL_CONCURRENCY" --props='{"backgroundVideo": "backgrounds/bg_01.mp4"}'

      - name: Upload Rendered Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel-1-page-01-idea-01-script-01
          path: flick-output/remotion/out/*.mp4
          retention-days: 14
