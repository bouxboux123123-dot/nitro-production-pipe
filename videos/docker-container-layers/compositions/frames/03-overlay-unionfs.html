<template id="03-overlay-unionfs-template">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<style>
  @font-face {
    font-family: 'Inter';
    src: url('assets/fonts/Inter-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('assets/fonts/JetBrainsMono-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #root-03 {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .floating-card {
    position: absolute;
    top: 200px;
    width: 960px;
    background: rgba(13, 17, 23, 0.94);
    border: 2px solid rgba(56, 189, 248, 0.35);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 229, 255, 0.15);
    backdrop-filter: blur(20px);
    overflow: hidden;
    padding: 36px 40px;
    opacity: 0;
  }

  .window-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 26px;
  }

  .window-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: #79c0ff;
  }

  .section-title {
    font-family: 'Inter', sans-serif;
    font-size: 34px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.25;
    margin-bottom: 26px;
  }
  .highlight-cyan { color: #00e5ff; }

  /* Overlay diagram */
  .diagram-container {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .union-box {
    background: rgba(22, 27, 34, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 18px;
    padding: 20px 24px;
  }

  .box-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .box-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    font-weight: 700;
    color: #00e5ff;
  }

  .box-badge {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 8px;
  }
  .badge-ro {
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.3);
  }

  .sub-layers-grid {
    display: flex;
    gap: 12px;
  }

  .sub-layer-item {
    flex: 1;
    background: rgba(13, 17, 23, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #e6edf3;
    opacity: 0;
  }

  .arrow-connector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 4px 0;
    opacity: 0;
  }
  .arrow-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: #7ee787;
  }
  .arrow-icon {
    font-size: 24px;
    color: #7ee787;
  }

  .merged-box {
    background: rgba(15, 30, 45, 0.9);
    border: 2px solid rgba(0, 229, 255, 0.5);
    border-radius: 18px;
    padding: 20px 24px;
    box-shadow: 0 0 24px rgba(0, 229, 255, 0.2);
    opacity: 0;
  }

  .merged-files-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 10px;
  }

  .file-badge {
    background: rgba(0, 229, 255, 0.12);
    border: 1px solid rgba(0, 229, 255, 0.4);
    border-radius: 8px;
    padding: 6px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #f0f6fc;
  }

  .summary-pill {
    margin-top: 22px;
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 16px;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
  }
  .summary-text {
    font-family: 'Inter', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: #e6edf3;
  }
  .summary-text strong {
    color: #00e5ff;
  }
</style>

<div id="root-03" data-composition-id="03-overlay-unionfs" data-width="1080" data-height="1920">
  <div id="card-03" class="floating-card">
    <div class="window-header">
      <div class="window-title">Kernel Filesystem · Overlay2</div>
      <div style="font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; color: #8b949e;">UNION MOUNT</div>
    </div>

    <div class="section-title">
      HOW <span class="highlight-cyan">OVERLAY2</span> MERGES ALL LAYERS
    </div>

    <div class="diagram-container">
      <!-- LowerDir -->
      <div class="union-box">
        <div class="box-header">
          <div class="box-label">LowerDir (Stack of Read-Only Layers)</div>
          <div class="box-badge badge-ro">FROZEN & IMMUTABLE</div>
        </div>
        <div class="sub-layers-grid">
          <div id="sub-l1" class="sub-layer-item">Base OS (/bin, /etc)</div>
          <div id="sub-l2" class="sub-layer-item">Python Runtime</div>
          <div id="sub-l3" class="sub-layer-item">Dependencies</div>
          <div id="sub-l4" class="sub-layer-item">Source Code</div>
        </div>
      </div>

      <!-- UnionFS merger -->
      <div id="arrow-box" class="arrow-connector">
        <span class="arrow-icon">▼</span>
        <span class="arrow-text">UnionFS Virtual Mount Overlay</span>
        <span class="arrow-icon">▼</span>
      </div>

      <!-- MergedDir -->
      <div id="merged-box" class="merged-box">
        <div class="box-header">
          <div class="box-label" style="color: #7ee787;">MergedDir (Unified File Tree)</div>
          <div style="font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 800; color: #7ee787;">SINGLE VIRTUAL ROOT</div>
        </div>
        <div class="merged-files-row">
          <span class="file-badge">📁 /app</span>
          <span class="file-badge">📁 /usr/local/bin</span>
          <span class="file-badge">📁 /lib</span>
          <span class="file-badge">📄 main.py</span>
          <span class="file-badge">📄 config.json</span>
        </div>
      </div>
    </div>

    <div id="summary-pill-03" class="summary-pill">
      <span style="font-size: 24px;">🔗</span>
      <div class="summary-text">All lower layers are stacked into one <strong>seamless unified directory tree</strong></div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["03-overlay-unionfs"] = tl;

  tl.fromTo("#card-03",
    { opacity: 0, y: 35, scale: 0.96 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
    0.2
  );

  // Sub-layers appear
  tl.fromTo("#sub-l1", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35 }, 2.5);
  tl.fromTo("#sub-l2", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35 }, 3.8);
  tl.fromTo("#sub-l3", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35 }, 5.2);
  tl.fromTo("#sub-l4", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.35 }, 6.5);

  // Overlay2 connector triggers
  tl.fromTo("#arrow-box", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.4 }, 8.0);

  // MergedDir reveals
  tl.fromTo("#merged-box", { opacity: 0, scale: 0.95 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" }, 9.5);

  // Summary pill appears
  tl.fromTo("#summary-pill-03",
    { opacity: 0, y: 15 },
    { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" },
    11.2
  );
</script>
</template>
