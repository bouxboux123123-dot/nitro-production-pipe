<template id="02-immutable-layers-template">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<style>
  @font-face {
    font-family: 'Inter';
    src: url('assets/fonts/Inter-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('assets/fonts/JetBrainsMono-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #root-02 {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .floating-card {
    position: absolute;
    top: 200px;
    width: 960px;
    background: rgba(13, 17, 23, 0.94);
    border: 2px solid rgba(56, 189, 248, 0.35);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 229, 255, 0.15);
    backdrop-filter: blur(20px);
    overflow: hidden;
    padding: 36px 40px;
    opacity: 0;
  }

  .window-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 28px;
  }

  .window-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: #79c0ff;
  }

  .section-title {
    font-family: 'Inter', sans-serif;
    font-size: 36px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.25;
    margin-bottom: 24px;
  }
  .highlight-cyan { color: #00e5ff; }

  /* Stack of layer cards */
  .layers-stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .layer-card {
    background: rgba(22, 27, 34, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 16px;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    opacity: 0;
  }

  .layer-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .layer-name {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: #f0f6fc;
  }

  .layer-hash {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    color: #8b949e;
  }
  .layer-hash.active-hash {
    color: #79c0ff;
  }

  .cache-badge {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 800;
    padding: 8px 16px;
    border-radius: 10px;
    letter-spacing: 0.04em;
    opacity: 0;
  }

  .badge-cached {
    color: #00e676;
    background: rgba(0, 230, 118, 0.15);
    border: 1px solid rgba(0, 230, 118, 0.5);
    box-shadow: 0 0 14px rgba(0, 230, 118, 0.35);
  }

  .badge-new {
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.15);
    border: 1px solid rgba(56, 189, 248, 0.4);
  }

  .summary-pill {
    margin-top: 24px;
    background: rgba(0, 230, 118, 0.08);
    border: 1px solid rgba(0, 230, 118, 0.3);
    border-radius: 16px;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
  }
  .summary-text {
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #e6edf3;
  }
  .summary-text strong {
    color: #00e676;
  }
</style>

<div id="root-02" data-composition-id="02-immutable-layers" data-width="1080" data-height="1920">
  <div id="card-02" class="floating-card">
    <div class="window-header">
      <div class="window-title">Docker Engine · Layer Cache</div>
      <div style="font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; color: #8b949e;">IMMUTABLE TARBALLS</div>
    </div>

    <div class="section-title">
      SHA-256 HASHES & <span class="highlight-cyan">INSTANT CACHE HITS</span>
    </div>

    <div class="layers-stack">
      <div id="layer-card-4" class="layer-card">
        <div class="layer-info">
          <div class="layer-name">Layer 4: COPY . . (3.2 MB)</div>
          <div class="layer-hash">sha256:7f4a08bc91...</div>
        </div>
        <div id="badge-4" class="cache-badge badge-new">BUILD NEW</div>
      </div>

      <div id="layer-card-3" class="layer-card">
        <div class="layer-info">
          <div class="layer-name">Layer 3: RUN pip install (142 MB)</div>
          <div class="layer-hash active-hash">sha256:c91e52ba44...</div>
        </div>
        <div id="badge-3" class="cache-badge badge-cached">CACHED ⚡</div>
      </div>

      <div id="layer-card-2" class="layer-card">
        <div class="layer-info">
          <div class="layer-name">Layer 2: COPY requirements.txt (1.4 KB)</div>
          <div class="layer-hash active-hash">sha256:2b90d3e510...</div>
        </div>
        <div id="badge-2" class="cache-badge badge-cached">CACHED ⚡</div>
      </div>

      <div id="layer-card-1" class="layer-card">
        <div class="layer-info">
          <div class="layer-name">Layer 1: FROM python:3.11-slim (125 MB)</div>
          <div class="layer-hash active-hash">sha256:88a1f4962e...</div>
        </div>
        <div id="badge-1" class="cache-badge badge-cached">CACHED ⚡</div>
      </div>
    </div>

    <div id="summary-pill-02" class="summary-pill">
      <span style="font-size: 26px;">⚡</span>
      <div class="summary-text">Unchanged layers re-use existing disk blobs: <strong>0s rebuild time</strong></div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["02-immutable-layers"] = tl;

  tl.fromTo("#card-02",
    { opacity: 0, y: 35, scale: 0.96 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
    0.2
  );

  // Stack layers upward
  tl.fromTo("#layer-card-1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 1.5);
  tl.fromTo("#layer-card-2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 2.8);
  tl.fromTo("#layer-card-3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 4.2);
  tl.fromTo("#layer-card-4", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35 }, 5.6);

  // Voice says "unique SHA-256 hash" around ~6.0s
  tl.to(".active-hash", { color: "#00e5ff", duration: 0.3, stagger: 0.1 }, 6.5);

  // Voice says "skips rebuilding entirely, delivering an instant cache hit" around ~9.0s
  tl.fromTo("#badge-1", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3 }, 8.8);
  tl.fromTo("#badge-2", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3 }, 9.2);
  tl.fromTo("#badge-3", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3 }, 9.6);
  tl.fromTo("#badge-4", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3 }, 10.2);

  // Summary pill appears
  tl.fromTo("#summary-pill-02",
    { opacity: 0, y: 15 },
    { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" },
    11.5
  );
</script>
</template>
