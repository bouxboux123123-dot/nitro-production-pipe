<template id="04-container-mount-template">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<style>
  @font-face {
    font-family: 'Inter';
    src: url('assets/fonts/Inter-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('assets/fonts/JetBrainsMono-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #root-04 {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .floating-card {
    position: absolute;
    top: 200px;
    width: 960px;
    background: rgba(13, 17, 23, 0.94);
    border: 2px solid rgba(56, 189, 248, 0.35);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 229, 255, 0.15);
    backdrop-filter: blur(20px);
    overflow: hidden;
    padding: 36px 40px;
    opacity: 0;
  }

  .window-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 24px;
  }

  .window-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: #79c0ff;
  }

  .section-title {
    font-family: 'Inter', sans-serif;
    font-size: 34px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.25;
    margin-bottom: 24px;
  }
  .highlight-cyan { color: #00e5ff; }

  /* UpperDir card */
  .upper-box {
    background: rgba(10, 30, 48, 0.95);
    border: 2px solid #00e5ff;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.25);
    border-radius: 18px;
    padding: 22px 26px;
    opacity: 0;
  }

  .box-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .box-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #00e5ff;
  }

  .badge-rw {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: #00e5ff;
    background: rgba(0, 229, 255, 0.2);
    border: 1px solid #00e5ff;
    padding: 4px 14px;
    border-radius: 8px;
  }

  .cow-connector {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 0;
    opacity: 0;
  }

  .cow-badge {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #ffb74d;
    background: rgba(255, 183, 77, 0.15);
    border: 1px solid rgba(255, 183, 77, 0.4);
    padding: 6px 18px;
    border-radius: 10px;
  }

  .lower-box {
    background: rgba(22, 27, 34, 0.9);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 20px 26px;
    opacity: 0;
  }

  .lower-badge {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: #8b949e;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    padding: 4px 12px;
    border-radius: 8px;
  }

  .summary-pill {
    margin-top: 22px;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 16px;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
  }
  .summary-text {
    font-family: 'Inter', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: #e6edf3;
  }
  .summary-text strong {
    color: #00e5ff;
  }
</style>

<div id="root-04" data-composition-id="04-container-mount" data-width="1080" data-height="1920">
  <div id="card-04" class="floating-card">
    <div class="window-header">
      <div class="window-title">Container Runtime · Mount</div>
      <div style="font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; color: #00e5ff;">ACTIVE EXECUTION</div>
    </div>

    <div class="section-title">
      <span class="highlight-cyan">UPPERDIR</span> & COPY-ON-WRITE (CoW)
    </div>

    <!-- UpperDir R/W layer -->
    <div id="upper-box" class="upper-box">
      <div class="box-header">
        <div class="box-label">UpperDir (Read-Write Container Layer)</div>
        <div class="badge-rw">READ / WRITE · ~2 MB</div>
      </div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #79c0ff; display: flex; gap: 14px;">
        <span>📝 config.py (modified copy)</span>
        <span>📄 /var/log/app.log (runtime file)</span>
      </div>
    </div>

    <!-- CoW Arrow -->
    <div id="cow-connector" class="cow-connector">
      <div class="cow-badge">▲ COPY-ON-WRITE (CoW) TRIGGERED ▲</div>
      <div style="font-family: 'Inter', sans-serif; font-size: 14px; color: #cfd8dc;">Original image is never modified — copy is promoted to UpperDir</div>
    </div>

    <!-- LowerDir Read-only Base -->
    <div id="lower-box" class="lower-box">
      <div class="box-header">
        <div class="box-label" style="color: #cfd8dc;">LowerDir (Base Image Layers)</div>
        <div class="lower-badge">READ-ONLY · FROZEN</div>
      </div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #8b949e;">
        <span>🔒 Original Python libraries, base OS files, and source code stay pristine</span>
      </div>
    </div>

    <div id="summary-pill-04" class="summary-pill">
      <span style="font-size: 24px;">🛡️</span>
      <div class="summary-text">The base image remains <strong>100% frozen & immutable</strong> for all containers</div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["04-container-mount"] = tl;

  tl.fromTo("#card-04",
    { opacity: 0, y: 35, scale: 0.96 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
    0.2
  );

  // UpperDir mounts on voiceover
  tl.fromTo("#upper-box", { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 2.0);

  // LowerDir shows underneath
  tl.fromTo("#lower-box", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 4.5);

  // CoW triggers as narrator explains file modification
  tl.fromTo("#cow-connector", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 8.0);

  // Summary pill appears
  tl.fromTo("#summary-pill-04",
    { opacity: 0, y: 15 },
    { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" },
    11.5
  );
</script>
</template>
