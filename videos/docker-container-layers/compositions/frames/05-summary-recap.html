<template id="05-summary-recap-template">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

<style>
  @font-face {
    font-family: 'Inter';
    src: url('assets/fonts/Inter-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }
  @font-face {
    font-family: 'JetBrains Mono';
    src: url('assets/fonts/JetBrainsMono-700.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  #root-05 {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .floating-card {
    position: absolute;
    top: 200px;
    width: 960px;
    background: rgba(13, 17, 23, 0.94);
    border: 2px solid rgba(56, 189, 248, 0.35);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 229, 255, 0.15);
    backdrop-filter: blur(20px);
    overflow: hidden;
    padding: 36px 40px;
    opacity: 0;
  }

  .window-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 24px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 24px;
  }

  .window-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    font-weight: 700;
    color: #79c0ff;
  }

  .section-title {
    font-family: 'Inter', sans-serif;
    font-size: 34px;
    font-weight: 900;
    color: #ffffff;
    line-height: 1.25;
    margin-bottom: 26px;
  }
  .highlight-cyan { color: #00e5ff; }

  /* 3 metric stat cards */
  .stats-grid {
    display: flex;
    gap: 16px;
    margin-bottom: 22px;
  }

  .stat-card {
    flex: 1;
    background: rgba(22, 27, 34, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.3);
    border-radius: 18px;
    padding: 22px 18px;
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 8px;
    opacity: 0;
  }

  .stat-label {
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: #8b949e;
    letter-spacing: 0.05em;
  }

  .stat-number {
    font-family: 'Inter', sans-serif;
    font-size: 40px;
    font-weight: 900;
    color: #00e5ff;
    text-shadow: 0 0 16px rgba(0, 229, 255, 0.5);
  }

  .stat-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: #cfd8dc;
  }

  .recap-box {
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid rgba(0, 229, 255, 0.4);
    border-radius: 18px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
  }

  .recap-row {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #e6edf3;
  }

  .summary-pill {
    margin-top: 22px;
    background: rgba(0, 230, 118, 0.08);
    border: 1px solid rgba(0, 230, 118, 0.35);
    border-radius: 16px;
    padding: 16px 22px;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
  }
  .summary-text {
    font-family: 'Inter', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: #e6edf3;
  }
  .summary-text strong {
    color: #00e676;
  }
</style>

<div id="root-05" data-composition-id="05-summary-recap" data-width="1080" data-height="1920">
  <div id="card-05" class="floating-card">
    <div class="window-header">
      <div class="window-title">Docker Architecture · Takeaway</div>
      <div style="font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 700; color: #00e676;">MAXIMUM EFFICIENCY</div>
    </div>

    <div class="section-title">
      SHARED BASE · <span class="highlight-cyan">ZERO WASTED STORAGE</span>
    </div>

    <!-- Stat cards -->
    <div class="stats-grid">
      <div id="stat-1" class="stat-card">
        <div class="stat-label">CONTAINERS</div>
        <div class="stat-number">10×</div>
        <div class="stat-sub">1 Shared Base Image</div>
      </div>
      <div id="stat-2" class="stat-card">
        <div class="stat-label">DISK SAVED</div>
        <div class="stat-number">93%</div>
        <div class="stat-sub">Zero Duplicate Blobs</div>
      </div>
      <div id="stat-3" class="stat-card">
        <div class="stat-label">STARTUP</div>
        <div class="stat-number">0.1s</div>
        <div class="stat-sub">Instant CoW Mount</div>
      </div>
    </div>

    <!-- Recap box -->
    <div id="recap-box" class="recap-box">
      <div class="recap-row">
        <span>✅</span>
        <span><strong>Immutable Layers:</strong> Cached and reusable across builds</span>
      </div>
      <div class="recap-row">
        <span>✅</span>
        <span><strong>Overlay2 UnionFS:</strong> Unified single-view file system</span>
      </div>
      <div class="recap-row">
        <span>✅</span>
        <span><strong>Copy-on-Write:</strong> Total process isolation with near-zero overhead</span>
      </div>
    </div>

    <div id="summary-pill-05" class="summary-pill">
      <span style="font-size: 24px;">🚀</span>
      <div class="summary-text">That's why Docker is <strong>blazing fast, lightweight, and isolated</strong></div>
    </div>
  </div>
</div>

<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  window.__timelines["05-summary-recap"] = tl;

  tl.fromTo("#card-05",
    { opacity: 0, y: 35, scale: 0.96 },
    { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" },
    0.2
  );

  // Stats pop in
  tl.fromTo("#stat-1", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 1.8);
  tl.fromTo("#stat-2", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 3.2);
  tl.fromTo("#stat-3", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4 }, 4.6);

  // Recap box appears
  tl.fromTo("#recap-box", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.5, ease: "power2.out" }, 6.5);

  // Summary pill appears
  tl.fromTo("#summary-pill-05",
    { opacity: 0, y: 15 },
    { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" },
    9.0
  );
</script>
</template>
