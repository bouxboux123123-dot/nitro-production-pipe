<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0d14;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
      }
      .bg-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(180deg, rgba(5, 10, 20, 0.6) 0%, rgba(5, 10, 20, 0.4) 50%, rgba(5, 10, 20, 0.75) 100%);
        pointer-events: none;
        z-index: 2;
      }
      .video-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="68.712"
      data-width="1080"
      data-height="1920"
    >
      <!-- Background Minecraft gameplay (cropped to 9:16 vertical) -->
      <video
        id="el-minecraft-bg"
        class="video-bg"
        src="assets/video/minecraft_bg.mp4"
        data-start="0"
        data-duration="68.712"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <!-- Gradient darkening overlay for contrast -->
      <div class="bg-overlay"></div>

      <!-- Frame 1: Dockerfile hook -->
      <div
        id="el-01-hook-dockerfile"
        class="scene"
        data-composition-id="01-hook-dockerfile"
        data-composition-src="compositions/frames/01-hook-dockerfile.html"
        data-start="0"
        data-duration="13.704"
        data-track-index="1"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/audio/voice-01.wav"
        data-start="0"
        data-duration="13.704"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- Frame 2: Immutable layers & cache hits -->
      <div
        id="el-02-immutable-layers"
        class="scene"
        data-composition-id="02-immutable-layers"
        data-composition-src="compositions/frames/02-immutable-layers.html"
        data-start="13.704"
        data-duration="14.208"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-layers-voice"
        src="assets/audio/voice-02.wav"
        data-start="13.704"
        data-duration="14.208"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- Frame 3: Overlay2 UnionFS -->
      <div
        id="el-03-overlay-unionfs"
        class="scene"
        data-composition-id="03-overlay-unionfs"
        data-composition-src="compositions/frames/03-overlay-unionfs.html"
        data-start="27.912"
        data-duration="14.088"
        data-track-index="1"
      ></div>
      <audio
        id="el-03-overlay-voice"
        src="assets/audio/voice-03.wav"
        data-start="27.912"
        data-duration="14.088"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- Frame 4: UpperDir & CoW container mount -->
      <div
        id="el-04-container-mount"
        class="scene"
        data-composition-id="04-container-mount"
        data-composition-src="compositions/frames/04-container-mount.html"
        data-start="42.0"
        data-duration="14.424"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-mount-voice"
        src="assets/audio/voice-04.wav"
        data-start="42.0"
        data-duration="14.424"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- Frame 5: Architecture summary & payoff -->
      <div
        id="el-05-summary-recap"
        class="scene"
        data-composition-id="05-summary-recap"
        data-composition-src="compositions/frames/05-summary-recap.html"
        data-start="56.424"
        data-duration="12.288"
        data-track-index="1"
      ></div>
      <audio
        id="el-05-summary-voice"
        src="assets/audio/voice-05.wav"
        data-start="56.424"
        data-duration="12.288"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- Kinetic center captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="68.712"
        data-track-index="2"
        data-track-kind="captions"
        style="z-index: 10;"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
